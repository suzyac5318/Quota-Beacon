name: macOS Release

on:
  push:
    tags:
      - "macos-v*"

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install macOS universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify release tag, lineage, and source versions
        shell: bash
        run: .github/scripts/verify-macos-release-version.sh --tag "$GITHUB_REF_NAME"
      - name: Test release guard failure cases
        shell: bash
        run: .github/scripts/test-macos-release-guards.sh
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --target universal-apple-darwin
      - name: Create and verify final macOS release assets
        shell: bash
        run: .github/scripts/create-macos-release-assets.sh src-tauri/target/universal-apple-darwin/release/bundle release-assets "$(tr -d '[:space:]' < VERSION)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quota-beacon-macos-universal-ad-hoc
          path: |
            release-assets/quota-beacon-macos-universal-ad-hoc.dmg
            release-assets/quota-beacon-macos-universal-ad-hoc.dmg.sha256
            release-assets/quota-beacon-macos-universal-ad-hoc.zip
            release-assets/quota-beacon-macos-universal-ad-hoc.zip.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quota-beacon-macos-universal-ad-hoc
          path: release-assets
      - name: Verify downloaded macOS release assets
        shell: bash
        run: |
          .github/scripts/verify-macos-release-assets.sh release-assets
          echo "RELEASE_NAME=Quota Beacon macOS ${GITHUB_REF_NAME#macos-}" >> "$GITHUB_ENV"
      - name: Create draft macOS release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ env.RELEASE_NAME }}
          files: |
            release-assets/quota-beacon-macos-universal-ad-hoc.dmg
            release-assets/quota-beacon-macos-universal-ad-hoc.dmg.sha256
            release-assets/quota-beacon-macos-universal-ad-hoc.zip
            release-assets/quota-beacon-macos-universal-ad-hoc.zip.sha256
          draft: true
          generate_release_notes: true
